# Metryki aplikacji wystawia otel-collector, metryki z trace'ów (zakładka Monitor) jaeger (ADR-0009).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8889"]
