# Uruchomienie: cp .env.example .env, uzupełnij sekrety, docker compose up -d --build (NFR-07, NFR-08).
# Profile: `observability` (jaeger, prometheus, perses), `llm` (Ollama w kontenerze zamiast na hoście).

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

x-backend: &backend
  <<: *hardening
  env_file: .env
  environment: &backend-env
    RABBITMQ_URL: amqp://${RABBITMQ_USER:?ustaw w .env}:${RABBITMQ_PASSWORD:?ustaw w .env}@rabbitmq:5672/
    FILE_STORE_DIR: /jobs
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318  # OTLP/HTTP (ADR-0024)
  volumes:
    - jobs:/jobs
  depends_on:
    rabbitmq:
      condition: service_healthy
    otel-collector:
      condition: service_started

services:
  frontend:
    <<: *hardening
    build: ./frontend
    ports:
      - "8080:8080"  # jedyny port aplikacji na zewnątrz
    tmpfs:
      - /tmp
      - /var/cache/nginx
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *backend
    build:
      context: ./backend
      target: api
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: forms2json-api
      # Stabilne konwencje HTTP: metryka http.server.request.duration zamiast starej http.server.duration.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    tmpfs:
      # Starlette zapisuje upload > 1 MB w /tmp: ma zostać w RAM (ADR-0022, NFR-06).
      # Podgląd oryginału (ADR-0031) trzyma tam jeszcze kopię pliku, PDF i profil soffice.
      - /tmp:size=160m
      - /home/app  # profil LibreOffice (soffice) przy podglądzie oryginału
    healthcheck:  # test z obrazu (backend/Dockerfile), tu tylko szybszy start
      interval: 10s
      timeout: 3s
      start_period: 30s
      start_interval: 2s

  worker:
    <<: *backend
    build:
      context: ./backend
      target: worker
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: forms2json-worker
    tmpfs:
      - /tmp
      - /home/app  # profil LibreOffice (soffice) przy konwersji .doc
    extra_hosts:
      # Ollama na hoście (LLM_BASE_URL); na Linuksie Docker nie dodaje tej nazwy sam.
      - host.docker.internal:host-gateway

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.1.4-alpine
    # Jako root obraz zmienia właściciela katalogów, a to pada przy cap_drop i tmpfs (.erlang.cookie).
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?ustaw w .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?ustaw w .env}
    tmpfs:
      # Kolejki są nietrwałe (NFR-06), więc stan brokera trzymamy tylko w RAM.
      - /var/lib/rabbitmq:uid=100,gid=101,mode=0700
      - /tmp
    healthcheck:
      # `ping` odpowiada, zanim broker słucha na 5672; to sprawdza port AMQP.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      start_interval: 2s

  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.165.0  # contrib: receiver docker_stats
    command: ["--config=/etc/otelcol/config.yaml"]
    # Dostęp do docker.sock przez grupę jego właściciela zamiast user: "0" (ADR-0030). Docker Desktop: root:root,
    # więc 0; Linux: grupa docker, deploy.sh ustawia DOCKER_GID z socketu. Bez dostępu cały Collector nie wstaje.
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  jaeger:
    <<: *hardening
    profiles: [observability]
    image: jaegertracing/jaeger:2.23.0
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./deploy/jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
      # UI bez logowania: domyślnie tylko z localhosta, na serwerze OBSERVABILITY_BIND=0.0.0.0 wystawia je na zewnątrz.
      - "${OBSERVABILITY_BIND:-127.0.0.1}:16686:16686"

  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:uid=65534,gid=65534
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:9090:9090"

  perses:
    <<: *hardening
    profiles: [observability]
    image: persesdev/perses:v0.55.1  # obraz działa jako nonroot (65532)
    volumes:
      # Dashboard jako kod (ADR-0030): zmiana pliku + restart usługi.
      - ./deploy/perses/config.yaml:/etc/perses/config.yaml:ro
      - ./deploy/perses/resources:/etc/perses/resources:ro
    tmpfs:
      # Baza plików i rozpakowane pluginy: stan odtwarzany z repo przy każdym starcie.
      - /perses:uid=65532,gid=65532
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:8081:8080"
    depends_on:
      - prometheus

  llm-runtime:
    <<: *hardening
    profiles: [llm]
    image: ollama/ollama:0.40.17
    environment:
      # Prompt (do ok. 10k tokenów) + LLM_MAX_OUTPUT_TOKENS musi się zmieścić w oknie (#103, ADR-0007).
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      # Modelu nie pobieramy automatycznie: docker compose exec llm-runtime ollama pull <LLM_MODEL>
      - ollama:/root/.ollama
    tmpfs:
      - /tmp

volumes:
  jobs:
    # Pliki z uploadu żyją tylko w RAM i znikają po zadaniu albo po FILE_TTL_SECONDS (ADR-0005, NFR-06).
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m,uid=10001,gid=10001,mode=0700
  ollama:
