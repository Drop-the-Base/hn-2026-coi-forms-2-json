server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # DNS Dockera rozwiązuje `api` przy żądaniu, więc nginx startuje także bez działającego API.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # Limit rozmiaru pliku egzekwuje API (NFR-08), proxy go nie dubluje.
    client_max_body_size 0;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE z postępem pipeline'u (ADR-0014).
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass $api;
    }

    location / {
        try_files $uri /index.html;
    }
}
